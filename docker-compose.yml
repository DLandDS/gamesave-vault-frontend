version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamesave-vault-frontend
    ports:
      - "5173:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_API_BASE_URL=http://localhost:3000
    restart: unless-stopped