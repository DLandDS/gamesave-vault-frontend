# Nama workflow ini yang akan muncul di tab "Actions" GitHub Anda
name: Docker Image CI

# Menentukan event yang akan memicu workflow ini
# Workflow ini akan berjalan setiap kali ada push ke branch 'master' atau 'dev'
on:
  push:
    branches:
      - master
      - dev

# Permissions yang diperlukan untuk workflow ini
permissions:
  contents: read
  packages: write

# Definisi satu atau lebih job yang akan dijalankan oleh workflow ini
jobs:
  # Nama job ini, bisa apa saja
  build-and-push:
    # Menentukan runner environment (OS) untuk job ini
    runs-on: ubuntu-latest
    
    # Permissions yang diperlukan untuk GitHub Container Registry
    permissions:
      contents: read
      packages: write

    # Langkah-langkah (steps) yang akan dijalankan dalam job ini
    steps:
      # Langkah 1: Checkout kode repositori Anda
      # Ini penting agar workflow dapat mengakses Dockerfile dan kode aplikasi Anda
      - name: Checkout repository
        uses: actions/checkout@v4

      # Langkah 2: Login ke GitHub Container Registry (GHCR)
      # Menggunakan action 'docker/login-action' untuk autentikasi
      # Username adalah GITHUB_ACTOR (nama pengguna yang memicu action)
      # Password adalah GITHUB_TOKEN (token rahasia yang disediakan GitHub untuk setiap workflow)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Langkah 3: Menentukan tag image berdasarkan nama branch
      # Inisialisasi variabel 'IMAGE_TAG' dan 'REPO_NAME_LOWER'
      # Jika branch adalah 'master', tag akan menjadi 'latest'
      # Jika branch adalah 'dev', tag akan menjadi 'staging'
      # Jika branch lain, ini tidak akan memicu build image ini
      - name: Determine image tag
        id: set_image_tag
        run: |
          IMAGE_TAG=""
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            IMAGE_TAG="latest"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            IMAGE_TAG="staging"
          fi
          # Convert repository name to lowercase for Docker compliance
          REPO_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "REPO_NAME_LOWER=${REPO_NAME_LOWER}" >> $GITHUB_OUTPUT
          echo "Image tag will be: ${IMAGE_TAG}"
          echo "Repository name (lowercase): ${REPO_NAME_LOWER}"

      # Langkah 4: Membangun dan mengunggah image Docker
      # Action ini akan secara otomatis mendeteksi Dockerfile di root repositori
      # `context: .` menunjukkan konteks build adalah direktori saat ini
      # `push: true` berarti image akan diunggah setelah dibangun
      # `tags:` menentukan tag lengkap untuk image, termasuk nama repositori dan tag yang ditentukan sebelumnya
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.set_image_tag.outputs.REPO_NAME_LOWER }}:${{ steps.set_image_tag.outputs.IMAGE_TAG }}
        # Kondisi: Langkah ini hanya akan dijalankan jika IMAGE_TAG tidak kosong
        # Ini mencegah build/push jika bukan branch 'master' atau 'dev'
        if: ${{ steps.set_image_tag.outputs.IMAGE_TAG != '' }}

